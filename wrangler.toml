# Cloudflare Pages configuration (static site + Pages Functions in /functions)
name = "hexora-labs"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (GMAIL_USER, GMAIL_APP_PASSWORD, INQUIRY_TO) are NOT stored here.
# Local: .dev.vars (git-ignored). Production: Cloudflare Pages → Settings → Variables and Secrets.
