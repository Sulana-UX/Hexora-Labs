# Hexora Labs API — Cloudflare Worker (deploy: npm run deploy:api)
name = "hexora-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Bundle the PNG logo used in the PDF header
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[vars]
# Website origins allowed to call the API (comma-separated).
# Add your live site URL(s), e.g. "https://hexora-labs.pages.dev,https://www.yourdomain.com"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put GMAIL_USER
#   npx wrangler secret put GMAIL_APP_PASSWORD
#   npx wrangler secret put INQUIRY_TO
# Local development reads them from backend/.dev.vars (git-ignored).
